---
# Local trace backend for workbench runs: Tempo stores spans, Grafana shows them.
# Ports bind to 127.0.0.1 only. OTLP uses 14318 because a workstation collector
# may already hold the default 4318.
name: course-02-telemetry
services:
  tempo:
    image: grafana/tempo:latest
    container_name: course-02-telemetry-tempo-container
    command: -config.file=/etc/tempo/config.yaml
    configs:
      - source: tempo-config
        target: /etc/tempo/config.yaml
    mem_limit: 512m
    ports:
      - 127.0.0.1:14318:4318
    volumes:
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: course-02-telemetry-grafana-container
    depends_on:
      - tempo
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/telemetry.yaml
      - source: grafana-dashboard-provider
        target: /etc/grafana/provisioning/dashboards/telemetry.yaml
      - source: grafana-meridian-workbench-dashboard
        target: /var/lib/grafana-dashboards/meridian-workbench.json
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      # Local only: anyone reaching 127.0.0.1:3000 is admin, so no password to manage.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    mem_limit: 256m
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  tempo-data:
  grafana-data:

configs:
  tempo-config:
    content: |
      stream_over_http_enabled: true
      server:
        http_listen_port: 3200
      distributor:
        # Span files cap values at 4000 characters; the default 2048 bytes would cut them here.
        max_attribute_bytes: 16384
        receivers:
          otlp:
            protocols:
              http:
                endpoint: 0.0.0.0:4318
      storage:
        trace:
          backend: local
          wal:
            path: /var/tempo/wal
          local:
            path: /var/tempo/blocks
      usage_report:
        reporting_enabled: false

  grafana-datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo:3200
          isDefault: true
          editable: false

  grafana-dashboard-provider:
    content: |
      apiVersion: 1
      providers:
        - name: telemetry
          type: file
          disableDeletion: false
          allowUiUpdates: false
          options:
            path: /var/lib/grafana-dashboards

  # Inline so Compose writes it world-readable; a bind-mounted file keeps the checkout's
  # permissions, which the grafana user may not read. $$ is a literal $ for Compose.
  # yamllint disable rule:line-length
  grafana-meridian-workbench-dashboard:
    content: |
      {
        "uid": "meridian-workbench",
        "title": "Meridian workbench",
        "description": "Course 2 incident-agent runs traced by the workbench: outcomes, cost, time, agents and tools.",
        "tags": [
          "meridian",
          "workbench"
        ],
        "editable": false,
        "schemaVersion": 41,
        "time": {
          "from": "now-24h",
          "to": "now"
        },
        "refresh": "",
        "templating": {
          "list": [
            {
              "name": "harness",
              "label": "Harness",
              "type": "query",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "query": {
                "refId": "TempoDatasourceVariableQueryEditor-VariableQuery",
                "type": 1,
                "label": "meridian.harness"
              },
              "definition": "meridian.harness",
              "refresh": 2,
              "multi": true,
              "includeAll": true,
              "allValue": ".*",
              "current": {
                "selected": true,
                "text": [
                  "All"
                ],
                "value": [
                  "$$__all"
                ]
              },
              "sort": 1
            },
            {
              "name": "case_id",
              "label": "Case",
              "type": "query",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "query": {
                "refId": "TempoDatasourceVariableQueryEditor-VariableQuery",
                "type": 1,
                "label": "meridian.case_id"
              },
              "definition": "meridian.case_id",
              "refresh": 2,
              "multi": true,
              "includeAll": true,
              "allValue": ".*",
              "current": {
                "selected": true,
                "text": [
                  "All"
                ],
                "value": [
                  "$$__all"
                ]
              },
              "sort": 1
            },
            {
              "name": "model",
              "label": "Model",
              "type": "query",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "query": {
                "refId": "TempoDatasourceVariableQueryEditor-VariableQuery",
                "type": 1,
                "label": "meridian.model"
              },
              "definition": "meridian.model",
              "refresh": 2,
              "multi": true,
              "includeAll": true,
              "allValue": ".*",
              "current": {
                "selected": true,
                "text": [
                  "All"
                ],
                "value": [
                  "$$__all"
                ]
              },
              "sort": 1
            }
          ]
        },
        "panels": [
          {
            "id": 1,
            "type": "row",
            "title": "Overview",
            "collapsed": false,
            "gridPos": {
              "x": 0,
