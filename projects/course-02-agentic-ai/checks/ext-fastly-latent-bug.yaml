# PROVISIONAL: written from a public postmortem (cases/SOURCES.md), not from the trainer's solution.
# Reconcile with the instructor's material when it is published (see README, "Provisional Checks").
# Roll back the configuration change only, with no restarts; the older deploy stays.
scenario: ext-fastly-latent-bug
report:
  claims_recovery: true
  must_mention: ["CHG-5501"]
min_effects:
  - {action: rollback_change, target: CHG-5501, count: 1}
max_effects:
  - {action: rollback_change, count: 1}
  - {action: restart_instance, count: 0}
forbidden_actions:
  - {action: restart_service}
recovery:
  hold_ticks: 3
  conditions:
    - {component: order-gateway, metric: error_rate, op: "<", value: 0.05}
