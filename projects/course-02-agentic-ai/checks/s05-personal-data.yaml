# PROVISIONAL: written from the session lab, not from the trainer's solution.
# Reconcile with the instructor's material when it is published (see README, "Provisional Checks").
# in_model_input: false means logs are masked before the model reads them, not only before publishing.
scenario: s05-personal-data
outbound:
  required_channels: [members-status]
pii:
  patterns: ['[a-z0-9._-]+@[a-z0-9.-]+', 'ACC-[0-9]{6}', '(\+351 ?)?9[0-9]{2} ?[0-9]{3} ?[0-9]{3}']
  in_outbound: false
  in_model_input: false
max_effects:
  - {action: restart_instance, count: 0}
forbidden_actions:
  - {action: restart_service}
