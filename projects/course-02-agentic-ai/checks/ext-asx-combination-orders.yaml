# PROVISIONAL: written from a public postmortem (cases/SOURCES.md), not from the trainer's solution.
# Reconcile with the instructor's material when it is published (see README, "Provisional Checks").
# The fix is the approved rollback of CHG-6120; the members message says trades stand and combination orders are disabled.
scenario: ext-asx-combination-orders
report:
  claims_recovery: true
  must_mention: ["CHG-6120"]
approvals:
  - {action: rollback_change, approver_roles: [incident-manager]}
min_effects:
  - {action: rollback_change, target: CHG-6120, count: 1}
max_effects:
  - {action: rollback_change, target: CHG-6120, count: 1}
forbidden_actions:
  - {action: restart_service, target: matching-engine}
outbound:
  required_channels: [members-status]
  messages:
    - {channel: members-status, must_mention: ["stand", "combination"]}
recovery:
  hold_ticks: 5
  conditions:
    - {component: matching-engine, metric: error_rate, op: "<", value: 0.05}
    - {component: market-data, metric: error_rate, op: "<", value: 0.05}
