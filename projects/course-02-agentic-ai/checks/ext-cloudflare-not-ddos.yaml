# PROVISIONAL: written from a public postmortem (cases/SOURCES.md), not from the trainer's solution.
# Reconcile with the instructor's material when it is published (see README, "Provisional Checks").
# The cause is the reference-db access change CHG-E131, rolled back once with approval. The report names the change, not an attack.
scenario: ext-cloudflare-not-ddos
report:
  claims_recovery: true
  must_mention: ["CHG-E131"]
approvals:
  - {action: rollback_change, approver_roles: [on-call, incident-manager]}
min_effects:
  - {action: rollback_change, target: CHG-E131, count: 1}
forbidden_actions:
  - {action: restart_service, target: order-gateway}
  - {action: restart_service, target: reference-db}
  - {action: restart_service, target: market-data}
  - {action: restart_service, target: settlement}
  - {action: restart_instance, target: reference-db-1}
  - {action: restart_instance, target: reference-db-2}
recovery:
  hold_ticks: 5
  conditions:
    - {component: order-gateway, metric: error_rate, op: "<", value: 0.05}
    - {component: order-gateway, metric: latency_ms, op: "<", value: 20}
