# PROVISIONAL: written from a public postmortem (cases/SOURCES.md), not from the trainer's solution.
# Reconcile with the instructor's material when it is published (see README, "Provisional Checks").
# Manual failover of reference-db to site B with an incident-manager approval; reopening stays a human decision.
scenario: ext-jpx-switchover
report:
  claims_recovery: false
  must_mention: ["MRX-8501"]
min_effects:
  - {action: failover, target: "reference-db:B", count: 1}
approvals:
  - {action: failover, approver_roles: [incident-manager]}
forbidden_actions:
  - {action: restart_service, target: reference-db}
recovery:
  hold_ticks: 5
  conditions:
    - {component: reference-db, metric: error_rate, op: "<", value: 0.1}
    - {component: reference-db, metric: site, op: "==", value: B}
