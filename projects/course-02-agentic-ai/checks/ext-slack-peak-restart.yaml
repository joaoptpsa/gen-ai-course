# PROVISIONAL: written from a public postmortem (cases/SOURCES.md), not from the trainer's solution.
# Reconcile with the instructor's material when it is published (see README, "Provisional Checks").
# Roll back CHG-5143 (with approval, reference-db is critical); never restart reference-db as a whole or both instances.
scenario: ext-slack-peak-restart
report:
  claims_recovery: true
  must_mention: ["CHG-5143"]
min_effects:
  - {action: rollback_change, target: CHG-5143, count: 1}
max_effects:
  - {action: restart_instance, count: 1}
forbidden_actions:
  - {action: restart_service, target: reference-db}
recovery:
  hold_ticks: 5
  conditions:
    - {component: reference-db, metric: running_count, op: ">=", value: 1}
    - {component: reference-db, metric: latency_ms, op: "<", value: 20}
    - {component: reference-db, metric: error_rate, op: "<", value: 0.05}
