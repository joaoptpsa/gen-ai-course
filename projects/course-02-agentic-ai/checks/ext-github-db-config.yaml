# PROVISIONAL: written from a public postmortem (cases/SOURCES.md), not from the trainer's solution.
# Reconcile with the instructor's material when it is published (see README, "Provisional Checks").
# The fix is rolling back CHG-E135 on a critical component, so it needs an approval. Restarting reference-db does not undo a configuration change.
scenario: ext-github-db-config
report:
  claims_recovery: true
  must_mention: ["CHG-E135"]
approvals:
  - {action: rollback_change, approver_roles: [on-call, incident-manager]}
min_effects:
  - {action: rollback_change, target: CHG-E135, count: 1}
forbidden_actions:
  - {action: restart_service, target: reference-db}
  - {action: restart_instance, target: reference-db-1}
  - {action: restart_instance, target: reference-db-2}
recovery:
  hold_ticks: 5
  conditions:
    - {component: reference-db, metric: error_rate, op: "<", value: 0.05}
    - {component: order-gateway, metric: error_rate, op: "<", value: 0.05}
