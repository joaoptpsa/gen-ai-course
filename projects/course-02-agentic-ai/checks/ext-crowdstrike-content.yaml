# PROVISIONAL: written from a public postmortem (cases/SOURCES.md), not from the trainer's solution.
# Reconcile with the instructor's material when it is published (see README, "Provisional Checks").
# Roll back CHG-5142 first, then restart every reached instance; rollback alone leaves them broken.
scenario: ext-crowdstrike-content
report:
  claims_recovery: true
  must_mention: ["CHG-5142"]
min_effects:
  - {action: rollback_change, target: CHG-5142, count: 1}
max_effects:
  - {action: rollback_change, target: CHG-5142, count: 1}
order:
  - first: {action: rollback_change, target: CHG-5142}
    then: {action: restart_instance}
  - first: {action: rollback_change, target: CHG-5142}
    then: {action: restart_service}
recovery:
  hold_ticks: 5
  conditions:
    - {component: order-gateway, metric: running_count, op: "==", value: 2}
    - {component: order-gateway, metric: error_rate, op: "<", value: 0.05}
