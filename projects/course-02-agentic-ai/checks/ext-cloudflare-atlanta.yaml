# PROVISIONAL: written from a public postmortem (cases/SOURCES.md), not from the trainer's solution.
# Reconcile with the instructor's material when it is published (see README, "Provisional Checks").
# The cause is CHG-E132. Roll it back before touching any instance: a restart first relieves one instance and leaves the link degraded.
scenario: ext-cloudflare-atlanta
report:
  claims_recovery: true
  must_mention: ["CHG-E132"]
min_effects:
  - {action: rollback_change, target: CHG-E132, count: 1}
forbidden_actions:
  - {action: restart_service, target: order-gateway}
order:
  - first: {action: rollback_change, target: CHG-E132}
    then: {action: restart_instance}
recovery:
  hold_ticks: 5
  conditions:
    - {link: "order-gateway->matching-engine", state: up}
    - {component: order-gateway, metric: latency_ms, op: "<", value: 20}
