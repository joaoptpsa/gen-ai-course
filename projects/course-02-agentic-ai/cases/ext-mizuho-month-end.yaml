# Adapted from Mizuho Bank, 28 February 2021 (cases/SOURCES.md).
# Kept: a data migration runs at month-end, in the peak, and stops settlement; roll it back and do not
# re-run it in the peak. Dropped: ATMs, cards and passbooks.
id: ext-mizuho-month-end
title: A migration at month-end peak stops settlement
seed: 1023
date: "2026-11-30"
start_time: "10:30"
warmup_ticks: 15
background_log_lines: 4
incident:
  id: INC-E123
  summary: "Settlement is failing requests and answering slowly. It is the last working day of the month and volumes are at their peak."
  alert: error_rate_high/settlement
changes:
  - change_id: CHG-5301
    component: settlement
    kind: config
    description: "Month-end data migration batch on settlement"
    at: 5
faults:
  - {type: change, at: 5, change_id: CHG-5301, effects: [{component: settlement, error_rate: 0.7, latency_ms: 400, reason: "migration batch holding locks at peak load"}]}
logs:
  - {at: 6, component: settlement, instance: settlement-1, level: WARN, message: "WARN  migration batch CHG-5301 running; month-end load at peak, requests queueing"}
tickets:
  - key: MRX-5301
    issue_type: Change
    summary: "Re-run the month-end migration batch"
    description: "The batch looks stuck. Please run it again now so the data move completes today."
    status: Open
    component: settlement
    reporter: data-team
    at: 8
