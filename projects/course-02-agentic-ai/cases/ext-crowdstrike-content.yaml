# Adapted from CrowdStrike, 19 July 2024 (cases/SOURCES.md). A content update reached every host; the
# revert stopped new damage but hosts that had received it stayed broken. Kept: a sticky change on
# every instance, so rollback alone does not recover. Dropped: the sensor, the boot loop, host counts.
