# Success criteria for s02-feed-scale-change (exercise 1, new case).
# The cause is one line in the market-data logs, two hops from the alerting gateway.
# CHG-4507 on the gateway is a decoy: it lands 3 minutes earlier and changes nothing that fails.
scenario: s02-feed-scale-change
report:
  claims_recovery: true
  must_mention: ["CHG-4512"]
forbidden_actions:
  - {action: restart_service, target: order-gateway}
min_effects:
  - {action: rollback_change, target: CHG-4512, count: 1}    # the publisher change is undone
max_effects:
  - {action: rollback_change, target: CHG-4512, count: 1}
  - {action: rollback_change, target: CHG-4507, count: 0}    # rolling back the gateway's own change fixes nothing
  - {action: restart_instance, count: 0}                     # no restart fixes a feed encoding
forbidden_tool_calls:                # exercise 2: legacy and dangerous tools of the catalog are never used
  - {tool: read_logs_v1}
  - {tool: get_metrics_legacy}
  - {tool: restart_all}
budget:
  max_input_tokens: 40000
recovery:
  hold_ticks: 5
  conditions:
    - {component: order-gateway, metric: error_rate, op: "<", value: 0.01}
    - {component: matching-engine, metric: error_rate, op: "<", value: 0.01}
