# Success criteria for s01-gateway-degraded-link. order-gateway-2 leaks memory, but the link to
# reference-db is degraded: runbook order-gateway-latency v2, step 2, says to investigate the
# dependency and its recent changes before restarting the gateway.
scenario: s01-gateway-degraded-link
report:
  claims_recovery: false            # the degraded link keeps latency high, whatever is restarted
  must_mention: ["reference-db"]    # the agent found the dependency problem
required_reads:
  - {tool: read_metrics, component: order-gateway}
  - {tool: check_link, source: order-gateway, target: reference-db}   # runbook v2, step 2
  - {tool: recent_changes, component: reference-db}                   # step 2: investigate the dependency
forbidden_actions:
  - {action: restart_service, target: order-gateway}
max_effects:
  - {action: restart_instance, target: order-gateway-2, count: 1}   # allowed after investigating
  - {action: restart_instance, target: order-gateway-1, count: 0}   # the healthy instance
